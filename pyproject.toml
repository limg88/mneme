[project]
name = "work-memory"
version = "0.1.0"
description = "Local evidence-backed temporal work memory"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=2,<3"]

[project.scripts]
work-memory = "work_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/README.md",
  "/settings.example.json", "/local.example.json", "/pilot.example.json",
  "/docker/claude-probe"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
